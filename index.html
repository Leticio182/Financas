<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#6b7280;--border:#e3e6ea;--accent:#2563eb;--inc:#15803d;--exp:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--text:#eceff3;--muted:#98a1ad;--border:#2b323a;--accent:#60a5fa;--inc:#4ade80;--exp:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--text:#eceff3;--muted:#98a1ad;--border:#2b323a;--accent:#60a5fa;--inc:#4ade80;--exp:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{text-transform:capitalize;font-size:16px}
button{font:inherit;cursor:pointer}
.nav{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .full{grid-column:1/-1}
.lbl{font-size:12px;color:var(--muted)}
.val{font-size:20px;font-weight:700}
.full .val{font-size:26px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:0 0 6px}
h2{font-size:15px;margin:0 0 10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}
.bar{margin:8px 0}
.bar .top{display:flex;justify-content:space-between;font-size:13px}
.bar .track{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--exp);border-radius:6px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg3 button{padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.seg3 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chart{display:flex;gap:6px;height:140px;margin-bottom:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%;height:118px;border-bottom:1px solid var(--border)}
.b{width:42%;max-width:18px;border-radius:4px 4px 0 0}
.b.i{background:var(--inc)}.b.e{background:var(--exp)}
.col small{color:var(--muted);font-size:11px;margin-top:4px;text-transform:capitalize}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.trow{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr 1.1fr;gap:6px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;text-align:right}
.trow span:first-child{text-align:left}
.trow.th{color:var(--muted);font-size:12px;border-top:0}
.trow.click{cursor:pointer}
.trow.tot{font-weight:700}
.sub{font-size:13px;margin:14px 0 4px;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>💰 Minhas Finanças</h1>

  <div class="month">
    <button class="nav" id="prev" aria-label="Mês anterior">‹</button>
    <b id="mlabel"></b>
    <button class="nav" id="next" aria-label="Próximo mês">›</button>
  </div>

  <div class="card sum">
    <div class="full"><div class="lbl">Saldo do mês</div><div class="val" id="bal"></div></div>
    <div><div class="lbl">Receitas</div><div class="val inc" id="inc"></div></div>
    <div><div class="lbl">Despesas</div><div class="val exp" id="exp"></div></div>
  </div>

  <div class="card">
    <div class="seg">
      <button id="t-exp" class="on">Despesa</button>
      <button id="t-inc">Receita</button>
    </div>
    <input id="amount" type="text" inputmode="decimal" placeholder="Valor (ex.: 25,90)" autocomplete="off">
    <input id="desc" type="text" placeholder="Descrição (opcional)" autocomplete="off">
    <div class="row">
      <select id="cat"></select>
      <input id="date" type="date">
    </div>
    <p class="err" id="err"></p>
    <button class="add" id="add">Adicionar</button>
  </div>

  <div class="card" id="catcard">
    <h2>Despesas por categoria</h2>
    <div id="cats"></div>
  </div>

  <div class="card" id="repcard">
    <h2>Relatório mensal</h2>
    <div class="seg3" id="periods">
      <button data-n="3">3 meses</button>
      <button data-n="6" class="on">6 meses</button>
      <button data-n="12">12 meses</button>
    </div>
    <p class="note" id="rplabel"></p>
    <div class="legend"><span><i style="background:var(--inc)"></i>Receitas</span><span><i style="background:var(--exp)"></i>Despesas</span></div>
    <div class="chart" id="chart"></div>
    <div id="rtable"></div>
    <h3 class="sub">Despesas por categoria no período</h3>
    <div id="repcats"></div>
    <p class="note">Valores da tabela em R$. Toque em um mês para abri-lo.</p>
  </div>

  <div class="card">
    <h2>Lançamentos</h2>
    <div id="list"></div>
  </div>
</main>

<script>
(function(){
  var KEY='financas:v1';
  var CATS={exp:['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Outros'],inc:['Salário','Extra','Outros']};
  var tx=[],type='exp',cur=new Date(),period=6;
  cur.setDate(1);

  function load(){try{var r=localStorage.getItem(KEY);tx=r?JSON.parse(r):[];if(!Array.isArray(tx))tx=[]}catch(e){tx=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
  function $(id){return document.getElementById(id)}
  function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
  function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  function today(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function fillCats(){
    var s=$('cat');s.innerHTML='';
    CATS[type].forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});
  }

  function mname(d){return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}
  function mlab(d){return mname(d)+'/'+String(d.getFullYear()).slice(2)}
  function num(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

  function bars(box,by,total,msg){
    box.innerHTML='';
    var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
    if(!keys.length)box.appendChild(el('div','empty',msg));
    keys.forEach(function(k){
      var pct=total?Math.round(by[k]/total*100):0;
      var w=el('div','bar'),top=el('div','top');
      top.appendChild(el('span',null,k));top.appendChild(el('span',null,brl(by[k])+' · '+pct+'%'));
      var tr=el('div','track'),f=el('div','fill');f.style.width=pct+'%';tr.appendChild(f);
      w.appendChild(top);w.appendChild(tr);box.appendChild(w);
    });
  }

  function report(){
    var rows=[],all={},ti=0,te=0,max=1,i;
    for(i=period-1;i>=0;i--){
      var d=new Date(cur.getFullYear(),cur.getMonth()-i,1),m=ym(d),r={d:d,inc:0,exp:0};
      tx.forEach(function(t){
        if(t.date.indexOf(m)!==0)return;
        if(t.type==='inc')r.inc+=t.value;else{r.exp+=t.value;all[t.cat]=(all[t.cat]||0)+t.value}
      });
      ti+=r.inc;te+=r.exp;max=Math.max(max,r.inc,r.exp);rows.push(r);
    }
    $('rplabel').textContent='Período: '+mlab(rows[0].d)+' a '+mlab(rows[rows.length-1].d)+' (termina no mês selecionado)';

    var ch=$('chart');ch.innerHTML='';
    rows.forEach(function(r){
      var col=el('div','col'),bs=el('div','bars');
      var a=el('div','b i'),b=el('div','b e');
      a.style.height=(r.inc/max*100)+'%';a.style.minHeight=r.inc?'3px':'0';
      b.style.height=(r.exp/max*100)+'%';b.style.minHeight=r.exp?'3px':'0';
      bs.appendChild(a);bs.appendChild(b);col.appendChild(bs);col.appendChild(el('small',null,mname(r.d)));
      ch.appendChild(col);
    });

    var tb=$('rtable');tb.innerHTML='';
    var hd=el('div','trow th');
    ['Mês','Receitas','Despesas','Saldo'].forEach(function(h){hd.appendChild(el('span',null,h))});
    tb.appendChild(hd);
    rows.slice().reverse().forEach(function(r){
      var row=el('div','trow click'),s=r.inc-r.exp;
      row.appendChild(el('span',null,mlab(r.d)));
      row.appendChild(el('span','inc',num(r.inc)));
      row.appendChild(el('span','exp',num(r.exp)));
      row.appendChild(el('span',s<0?'exp':'inc',num(s)));
      row.onclick=function(){cur=new Date(r.d.getFullYear(),r.d.getMonth(),1);render();window.scrollTo({top:0,behavior:'smooth'})};
      tb.appendChild(row);
    });
    function linha(rot,a,b){
      var row=el('div','trow tot'),s=a-b;
      row.appendChild(el('span',null,rot));
      row.appendChild(el('span','inc',num(a)));
      row.appendChild(el('span','exp',num(b)));
      row.appendChild(el('span',s<0?'exp':'inc',num(s)));
      tb.appendChild(row);
    }
    linha('Total',ti,te);
    linha('Média',ti/period,te/period);

    bars($('repcats'),all,te,'Sem despesas no período.');
  }

  function render(){
    $('mlabel').textContent=cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    var m=ym(cur);
    var list=tx.filter(function(t){return t.date.indexOf(m)===0}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
    var inc=0,exp=0,by={};
    list.forEach(function(t){
      if(t.type==='inc')inc+=t.value;else{exp+=t.value;by[t.cat]=(by[t.cat]||0)+t.value}
    });
    $('inc').textContent=brl(inc);$('exp').textContent=brl(exp);
    var bal=inc-exp,b=$('bal');b.textContent=brl(bal);b.className='val '+(bal<0?'exp':'inc');

    bars($('cats'),by,exp,'Sem despesas neste mês.');
    report();

    var l=$('list');l.innerHTML='';
    if(!list.length)l.appendChild(el('div','empty','Nenhum lançamento neste mês.'));
    list.forEach(function(t){
      var it=el('div','item'),tt=el('div','t');
      var p=t.date.split('-');
      tt.appendChild(el('div',null,t.desc||t.cat));
      tt.appendChild(el('small',null,t.cat+' · '+p[2]+'/'+p[1]));
      var v=el('div',t.type==='inc'?'inc':'exp',(t.type==='inc'?'+ ':'− ')+brl(t.value));
      v.style.fontWeight='600';
      var d=el('button','del','×');d.setAttribute('aria-label','Excluir');
      d.onclick=function(){if(confirm('Excluir este lançamento?')){tx=tx.filter(function(x){return x.id!==t.id});save();render()}};
      it.appendChild(tt);it.appendChild(v);it.appendChild(d);l.appendChild(it);
    });
  }

  function setType(t){
    type=t;
    $('t-exp').className=t==='exp'?'on':'';
    $('t-inc').className=t==='inc'?'on':'';
    fillCats();
  }

  $('t-exp').onclick=function(){setType('exp')};
  $('t-inc').onclick=function(){setType('inc')};
  $('prev').onclick=function(){cur.setMonth(cur.getMonth()-1);render()};
  $('next').onclick=function(){cur.setMonth(cur.getMonth()+1);render()};

  Array.prototype.forEach.call(document.querySelectorAll('#periods button'),function(b){
    b.onclick=function(){
      period=parseInt(b.getAttribute('data-n'),10);
      Array.prototype.forEach.call(document.querySelectorAll('#periods button'),function(x){x.className=x===b?'on':''});
      report();
    };
  });

  $('add').onclick=function(){
    var raw=$('amount').value.trim().replace(/\./g,'').replace(',','.');
    var v=parseFloat(raw);
    if(!(v>0)){$('err').textContent='Informe um valor maior que zero.';return}
    var date=$('date').value||today();
    $('err').textContent='';
    tx.push({id:Date.now(),type:type,value:Math.round(v*100)/100,desc:$('desc').value.trim(),cat:$('cat').value,date:date});
    save();
    $('amount').value='';$('desc').value='';
    var d=new Date(date+'T00:00:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
    render();
  };

  load();
  $('date').value=today();
  fillCats();
  render();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
